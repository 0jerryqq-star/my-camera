<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工地相機</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工地相機">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --cam-bg:#000;
  --chrome:#141414;
  --chrome-text:#f2f2f2;
  --safety:#F5B800;
  --sheet-bg:#ffffff;
  --sheet-text:#1d1d1d;
  --sheet-muted:#6b6b6b;
  --field-bg:#f1f1ef;
  --field-border:#dcdcd8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sheet-bg:#1e1e1e; --sheet-text:#eeeeee; --sheet-muted:#a0a0a0;
    --field-bg:#2a2a2a; --field-border:#3a3a3a;
  }
}
:root[data-theme="dark"]{
  --sheet-bg:#1e1e1e; --sheet-text:#eeeeee; --sheet-muted:#a0a0a0;
  --field-bg:#2a2a2a; --field-border:#3a3a3a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--cam-bg);color:var(--chrome-text);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--safety);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--chrome)}
.topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.icon-btn{background:transparent;border:0;color:var(--chrome-text);font-size:15px;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.icon-btn:active{background:#2a2a2a}
.icon-btn svg{width:22px;height:22px}

.viewport{position:relative;flex:1;overflow:hidden;background:#000;touch-action:none}
.viewport video,.viewport img.src{position:absolute;inset:0;width:100%;height:100%}
.viewport video{object-fit:cover}
.viewport img.src{object-fit:contain}
#wm{position:absolute;left:0;top:0;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
#wm.dragging{cursor:grabbing;outline:2px dashed var(--safety);outline-offset:3px}
#wm[hidden]{display:none}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.fallback p{margin:0;max-width:32ch;line-height:1.6;color:#cfcfcf;font-size:15px}
.fallback[hidden]{display:none}
.big-btn{background:var(--safety);color:#111;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer}
.ghost-btn{background:transparent;color:var(--chrome-text);border:1px solid #555;border-radius:12px;padding:12px 20px;font-size:15px;cursor:pointer}

.bottombar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px 18px;background:var(--chrome)}
.wm-toggle{justify-self:start;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.wm-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.switch{width:46px;height:28px;border-radius:14px;background:#444;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.wm-toggle input:checked + .switch{background:var(--safety)}
.wm-toggle input:checked + .switch::after{transform:translateX(18px)}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;cursor:pointer}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{opacity:.35}
.thumb{justify-self:end;width:52px;height:52px;border-radius:10px;border:2px solid #fff;background:#222 center/cover no-repeat;cursor:pointer;padding:0}
.thumb:empty{visibility:hidden}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .25s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--sheet-bg);color:var(--sheet-text);border-radius:18px 18px 0 0;z-index:11;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sheet h2{margin:0;font-size:18px}
.sheet .done{background:var(--safety);color:#111;border:0;border-radius:10px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.sheet .body{overflow-y:auto;padding:4px 18px 22px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--field-border)}
.row:last-child{border-bottom:0}
.row .lbl{font-size:14px;font-weight:500}
.row .show{font-size:13px;color:var(--sheet-muted);display:flex;align-items:center;gap:6px}
.row .show input{width:18px;height:18px;accent-color:var(--safety)}
.row .field{grid-column:1 / -1;display:flex;gap:8px}
.row input[type=text]{flex:1;min-width:0;background:var(--field-bg);border:1px solid var(--field-border);color:var(--sheet-text);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit}
.row .auto{grid-column:1 / -1;font-size:14px;color:var(--sheet-muted)}
.chips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--field-bg);border:1px solid var(--field-border);color:var(--sheet-text);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.small-btn{background:var(--field-bg);border:1px solid var(--field-border);color:var(--sheet-text);border-radius:10px;padding:0 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.row input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--safety)}
.note{font-size:13px;color:var(--sheet-muted);margin:8px 0 0;line-height:1.5}

/* result */
.result{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.result[hidden]{display:none}
.result .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.result img{max-width:100%;max-height:100%;object-fit:contain}
.result .actions{display:flex;gap:12px;justify-content:center;padding:14px 18px 18px;background:var(--chrome)}
.result .status{text-align:center;font-size:13px;color:#bdbdbd;min-height:18px;padding:0 16px 4px;background:var(--chrome)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="flipBtn" aria-label="切換前後鏡頭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><path d="M9.5 12.5a3 3 0 0 1 5-1.5M14.5 14.5a3 3 0 0 1-5 1.5"/><path d="M14.8 9.6v1.6h-1.6M9.2 17.4v-1.6h1.6"/></svg>
    </button>
    <h1>📷 工地相機</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="設定浮水印內容">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      浮水印
    </button>
  </div>

  <div class="viewport" id="viewport">
    <video id="video" playsinline muted autoplay></video>
    <img class="src" id="srcImg" alt="" hidden>
    <canvas id="wm" aria-label="浮水印，可拖曳移動"></canvas>
    <div class="hint" id="hint">拖曳浮水印可以移動位置</div>
    <div class="fallback" id="fallback" hidden>
      <p id="fallbackMsg">正在開啟相機…</p>
      <label class="big-btn" for="fileCam">開啟相機拍照</label>
      <label class="ghost-btn" for="fileAlbum">從相簿選照片</label>
      <button class="ghost-btn" id="retryCam" hidden>重新嘗試即時相機</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileAlbum" accept="image/*" hidden>
    <div class="flash" id="flash"></div>
  </div>

  <div class="bottombar">
    <label class="wm-toggle">
      <input type="checkbox" id="wmToggle" checked>
      <span class="switch" aria-hidden="true"></span>
      <span id="wmLabel">浮水印 開</span>
    </label>
    <button class="shutter" id="shutter" aria-label="拍照"><span></span></button>
    <button class="thumb" id="thumb" aria-label="查看上一張照片"></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="浮水印設定">
  <header>
    <h2>浮水印內容</h2>
    <button class="done" id="doneBtn">完成</button>
  </header>
  <div class="body">
    <div class="row">
      <span class="lbl">日期＋工地名稱</span>
      <label class="show"><input type="checkbox" data-show="site" checked>顯示</label>
      <div class="field"><input type="text" data-key="site" placeholder="OOOO工地"></div>
      <div class="auto">日期會自動帶入拍照當天</div>
    </div>
    <div class="row">
      <span class="lbl">施工區域</span>
      <label class="show"><input type="checkbox" data-show="area" checked>顯示</label>
      <div class="field"><input type="text" data-key="area" placeholder="例：B棟 3F"></div>
    </div>
    <div class="row">
      <span class="lbl">施工內容</span>
      <label class="show"><input type="checkbox" data-show="content" checked>顯示</label>
      <div class="field"><input type="text" data-key="content" placeholder="例：樓板鋼筋綁紮"></div>
    </div>
    <div class="row">
      <span class="lbl">拍攝時間</span>
      <label class="show"><input type="checkbox" data-show="time" checked>顯示</label>
      <div class="auto">按下快門時自動記錄</div>
    </div>
    <div class="row">
      <span class="lbl">天氣</span>
      <label class="show"><input type="checkbox" data-show="weather" checked>顯示</label>
      <div class="field"><input type="text" data-key="weather" placeholder="例：晴"></div>
      <div class="chips" id="weatherChips">
        <button type="button">晴</button><button type="button">多雲</button><button type="button">陰</button><button type="button">小雨</button><button type="button">大雨</button><button type="button">雷雨</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">地點</span>
      <label class="show"><input type="checkbox" data-show="location" checked>顯示</label>
      <div class="field"><input type="text" data-key="location" placeholder="例：台北市信義區"><button type="button" class="small-btn" id="gpsBtn">📍 定位</button></div>
    </div>
    <div class="row">
      <span class="lbl">浮水印大小</span>
      <span class="show" id="scaleVal">100%</span>
      <input type="range" id="scale" min="0.6" max="1.8" step="0.05" value="1">
    </div>
    <p class="note">設定會記在這台裝置上，下次打開會自動帶入。</p>
  </div>
</section>

<div class="result" id="result" hidden>
  <div class="imgwrap"><img id="resultImg" alt="拍好的照片"></div>
  <div class="status" id="status"></div>
  <div class="actions">
    <button class="ghost-btn" id="retake">繼續拍照</button>
    <button class="big-btn" id="saveBtn">儲存照片</button>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const video=$('video'), srcImg=$('srcImg'), viewport=$('viewport'), wm=$('wm');
  const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font').trim() || 'sans-serif';

  // ---------- storage ----------
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const defaults = {
    site:'OOOO工地', area:'', content:'', weather:'', location:'',
    show:{site:true,area:true,content:true,time:true,weather:true,location:true},
    scale:1, enabled:true, pos:null
  };
  const S = Object.assign({}, defaults, store.get('sitecam:settings', {}));
  S.show = Object.assign({}, defaults.show, S.show||{});
  const save = () => store.set('sitecam:settings', S);

  // ---------- formatting ----------
  const pad = n => String(n).padStart(2,'0');
  const fmtDate = d => `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const fileStamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;

  // ---------- watermark drawing (shared by preview & final photo) ----------
  function wrap(ctx, text, maxW){
    const out=[]; let line='';
    for(const ch of Array.from(text)){
      if(ctx.measureText(line+ch).width > maxW && line){ out.push(line); line = ch===' '?'':ch; }
      else line += ch;
    }
    out.push(line); return out;
  }
  function layout(ctx, s, when){
    const W = 250*s, P = 11*s, inner = W-2*P;
    ctx.font = `700 ${15*s}px ${FONT}`;
    const headText = fmtDate(when) + (S.show.site && S.site.trim() ? '  ' + S.site.trim() : '');
    const head = wrap(ctx, headText, inner);
    const headLH = 20*s, headH = head.length*headLH + 14*s;
    ctx.font = `400 ${14*s}px ${FONT}`;
    const rows = [];
    const add = (k,label,val) => { if(S.show[k]) rows.push(...wrap(ctx, `${label}：${val||''}`, inner)); };
    add('area','施工區域',S.area.trim());
    add('content','施工內容',S.content.trim());
    add('time','拍攝時間',fmtDate(when)+' '+fmtTime(when));
    add('weather','天氣',S.weather.trim());
    add('location','地點',S.location.trim());
    const LH = 21*s;
    const bodyH = rows.length ? rows.length*LH + 14*s : 0;
    return {W, P, head, headLH, headH, rows, LH, bodyH, H: headH+bodyH, r: 6*s, s};
  }
  function drawWM(ctx, L){
    const {W,P,head,headLH,headH,rows,LH,bodyH,H,r,s} = L;
    ctx.save();
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0,0,W,H,r) : ctx.rect(0,0,W,H); ctx.clip();
    ctx.fillStyle = '#F5B800'; ctx.fillRect(0,0,W,headH);
    ctx.fillStyle = 'rgba(18,18,18,0.66)'; ctx.fillRect(0,headH,W,bodyH);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111';
    ctx.font = `700 ${15*s}px ${FONT}`;
    head.forEach((t,i)=>ctx.fillText(t, P, 7*s + headLH*(i+.5)));
    ctx.fillStyle = '#fff';
    ctx.font = `400 ${14*s}px ${FONT}`;
    rows.forEach((t,i)=>ctx.fillText(t, P, headH + 7*s + LH*(i+.5)));
    ctx.restore();
  }

  // ---------- preview overlay ----------
  let wmW=0, wmH=0;
  function renderPreview(){
    const dpr = window.devicePixelRatio||1;
    const c = wm.getContext('2d');
    const L = layout(c, S.scale, new Date());
    wmW=L.W; wmH=L.H;
    wm.width = Math.ceil(L.W*dpr); wm.height = Math.ceil(L.H*dpr);
    wm.style.width = L.W+'px'; wm.style.height = L.H+'px';
    c.setTransform(dpr,0,0,dpr,0,0);
    drawWM(c, L);
    placeWM();
  }
  function placeWM(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    let x, y;
    if(S.pos){ x = S.pos.x*vw; y = S.pos.y*vh; }
    else { x = 12; y = vh - wmH - 12; }
    x = Math.max(0, Math.min(x, vw-wmW)); y = Math.max(0, Math.min(y, vh-wmH));
    wm.style.transform = `translate(${x}px,${y}px)`;
    wm.dataset.x = x; wm.dataset.y = y;
  }
  function setEnabled(on){
    S.enabled = on; save();
    wm.hidden = !on;
    $('wmToggle').checked = on;
    $('wmLabel').textContent = on ? '浮水印 開' : '浮水印 關';
  }

  // drag
  let drag=null;
  wm.addEventListener('pointerdown', e=>{
    wm.setPointerCapture(e.pointerId);
    drag = {id:e.pointerId, sx:e.clientX, sy:e.clientY, ox:+wm.dataset.x, oy:+wm.dataset.y};
    wm.classList.add('dragging'); $('hint').style.opacity=0;
  });
  wm.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    const vw=viewport.clientWidth, vh=viewport.clientHeight;
    const x = Math.max(0, Math.min(drag.ox + e.clientX-drag.sx, vw-wmW));
    const y = Math.max(0, Math.min(drag.oy + e.clientY-drag.sy, vh-wmH));
    wm.style.transform = `translate(${x}px,${y}px)`; wm.dataset.x=x; wm.dataset.y=y;
  });
  const endDrag = e=>{
    if(!drag) return; drag=null; wm.classList.remove('dragging');
    S.pos = {x:+wm.dataset.x/viewport.clientWidth, y:+wm.dataset.y/viewport.clientHeight}; save();
  };
  wm.addEventListener('pointerup', endDrag); wm.addEventListener('pointercancel', endDrag);
  // keyboard nudge
  wm.tabIndex = 0;
  wm.addEventListener('keydown', e=>{
    const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];
    if(!d) return; e.preventDefault();
    const vw=viewport.clientWidth, vh=viewport.clientHeight;
    S.pos = {x:(+wm.dataset.x+d[0])/vw, y:(+wm.dataset.y+d[1])/vh}; save(); placeWM();
  });

  // ---------- camera ----------
  let stream=null, facing='environment', source='none'; // 'video' | 'image' | 'none'
  async function startCamera(){
    stopCamera();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ return showFallback('這個瀏覽器無法直接開啟即時相機，請用下面的按鈕拍照。'); }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
      video.srcObject = stream; await video.play().catch(()=>{});
      srcImg.hidden = true; video.hidden = false; source='video';
      $('fallback').hidden = true; $('shutter').disabled = false;
    }catch(err){
      showFallback(err && err.name==='NotAllowedError'
        ? '相機權限被拒絕了。可以用下面的按鈕改用手機內建相機拍照，或到瀏覽器設定允許相機。'
        : '無法開啟即時相機，請用下面的按鈕拍照。');
    }
  }
  function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
  function showFallback(msg){
    source='none'; video.hidden = true;
    $('fallbackMsg').textContent = msg; $('fallback').hidden = false;
    $('retryCam').hidden = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    $('shutter').disabled = true;
  }
  $('retryCam').onclick = startCamera;
  $('flipBtn').onclick = ()=>{ facing = facing==='environment'?'user':'environment'; startCamera(); };

  function onFile(e){
    const f = e.target.files && e.target.files[0]; e.target.value='';
    if(!f) return;
    const url = URL.createObjectURL(f);
    srcImg.onload = ()=>{
      stopCamera(); video.hidden = true; srcImg.hidden = false; source='image';
      $('fallback').hidden = true; $('shutter').disabled = false;
      $('hint').textContent = '把浮水印拖到想要的位置，再按快門合成'; $('hint').style.opacity=1;
    };
    srcImg.src = url;
  }
  $('fileCam').addEventListener('change', onFile);
  $('fileAlbum').addEventListener('change', onFile);

  // ---------- capture ----------
  function capture(){
    const when = new Date();
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    let el, sw0, sh0, cover;
    if(source==='video'){ el=video; sw0=video.videoWidth; sh0=video.videoHeight; cover=true; }
    else if(source==='image'){ el=srcImg; sw0=srcImg.naturalWidth; sh0=srcImg.naturalHeight; cover=false; }
    else return;
    if(!sw0||!sh0) return;
    const k = cover ? Math.max(vw/sw0, vh/sh0) : Math.min(vw/sw0, vh/sh0);
    const offX = (vw - sw0*k)/2, offY = (vh - sh0*k)/2;
    // region of the source to keep
    let rx=0, ry=0, rw=sw0, rh=sh0;
    if(cover){ rx=-offX/k; ry=-offY/k; rw=vw/k; rh=vh/k; }
    const out = document.createElement('canvas');
    out.width = Math.round(rw); out.height = Math.round(rh);
    const c = out.getContext('2d');
    c.drawImage(el, rx, ry, rw, rh, 0, 0, out.width, out.height);
    if(S.enabled){
      const L = layout(c, S.scale/k, when);
      let x = (+wm.dataset.x - offX)/k - rx, y = (+wm.dataset.y - offY)/k - ry;
      x = Math.max(0, Math.min(x, out.width-L.W)); y = Math.max(0, Math.min(y, out.height-L.H));
      c.translate(x,y); drawWM(c, L);
    }
    const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    out.toBlob(blob=>{
      if(!blob) return;
      last = {blob, name:`工地照片_${fileStamp(when)}.jpg`, url:URL.createObjectURL(blob)};
      $('thumb').style.backgroundImage = `url(${last.url})`; $('thumb').textContent=' ';
      openResult();
    }, 'image/jpeg', 0.92);
  }
  let last=null;
  $('shutter').onclick = capture;
  $('thumb').onclick = ()=>{ if(last) openResult(); };

  // ---------- result / save ----------
  let downloads = null;
  function openResult(){
    $('resultImg').src = last.url; $('result').hidden = false;
    $('status').textContent = '';
    $('saveBtn').hidden = false;
  }
  $('retake').onclick = ()=>{
    $('result').hidden = true;
    if(source==='image'){ showFallback('要再拍一張嗎？'); }
  };
  $('saveBtn').onclick = async ()=>{
    if(!last) return;
    $('status').textContent = '';
    if(!downloads){
      const a=document.createElement('a'); a.href=last.url; a.download=last.name;
      document.body.appendChild(a); a.click(); a.remove();
      $('status').textContent='已下載 '+last.name+'（iPhone 也可以長按照片存到相簿）';
      return;
    }
    try{
      await downloads.save({filename:last.name, data:last.blob});
      $('status').textContent = '已儲存 ' + last.name;
    }catch(err){
      const code = err && err.code;
      if(code==='declined') $('status').textContent = '已取消儲存';
      else if(code==='rate_limited') $('status').textContent = '請稍候再按一次儲存';
      else { downloads=null; $('status').textContent = '請再按一次儲存，或長按照片存到相簿'; }
    }
  };

  // ---------- settings sheet ----------
  const openSheet = o => { $('sheet').classList.toggle('open',o); $('scrim').classList.toggle('open',o); };
  $('settingsBtn').onclick = ()=>openSheet(true);
  $('doneBtn').onclick = ()=>openSheet(false);
  $('scrim').onclick = ()=>openSheet(false);
  document.querySelectorAll('[data-key]').forEach(inp=>{
    inp.value = S[inp.dataset.key] || '';
    inp.addEventListener('input', ()=>{ S[inp.dataset.key]=inp.value; save(); renderPreview(); });
  });
  document.querySelectorAll('[data-show]').forEach(cb=>{
    cb.checked = !!S.show[cb.dataset.show];
    cb.addEventListener('change', ()=>{ S.show[cb.dataset.show]=cb.checked; save(); renderPreview(); });
  });
  $('weatherChips').addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    const inp=document.querySelector('[data-key=weather]'); inp.value=e.target.textContent;
    S.weather=inp.value; save(); renderPreview();
  });
  const scale=$('scale');
  scale.value=S.scale; $('scaleVal').textContent=Math.round(S.scale*100)+'%';
  scale.addEventListener('input', ()=>{ S.scale=+scale.value; $('scaleVal').textContent=Math.round(S.scale*100)+'%'; save(); renderPreview(); });
  $('gpsBtn').onclick = ()=>{
    const inp=document.querySelector('[data-key=location]');
    if(!navigator.geolocation){ inp.placeholder='此裝置無法定位，請手動輸入'; return; }
    $('gpsBtn').textContent='定位中…';
    navigator.geolocation.getCurrentPosition(p=>{
      inp.value = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
      S.location=inp.value; save(); renderPreview(); $('gpsBtn').textContent='📍 定位';
    }, ()=>{ inp.value=''; inp.placeholder='無法取得定位，請手動輸入'; $('gpsBtn').textContent='📍 定位'; }, {enableHighAccuracy:true, timeout:10000});
  };

  $('wmToggle').addEventListener('change', e=>setEnabled(e.target.checked));

  // ---------- boot ----------
  setEnabled(S.enabled);
  const fontReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load(`700 15px "Noto Sans TC"`, '工地'), document.fonts.load(`400 14px "Noto Sans TC"`, '工地')]).catch(()=>{}) : Promise.resolve();
  renderPreview();
  fontReady.then(renderPreview);
  setInterval(()=>{ renderPreview(); }, 1000);
  window.addEventListener('resize', placeWM);
  setTimeout(()=>{ $('hint').style.opacity=0; }, 4000);
  startCamera();

  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(d=>{ downloads=d; }).catch(()=>{});
  }
})();
</script>
</body>
</html>
